# ─────────────────────────────────────────────────────────────────────────────
# [NODEJS] Uncomment if the repo contains package.json
# ─────────────────────────────────────────────────────────────────────────────
# Lint, typecheck and tests are PRE-PUSH. Typical measurements on a mid-size frontend:
# eslint ~13s, tsc ~4s, unit tests ~30s — tolerable per push, not per commit.
#
# Test-runner NOTE: scope the run to the main tree. A repo using git worktrees under
# .worktrees/ will otherwise collect every worktree's copy of every suite — hundreds of
# stale paths, minutes of runtime, and a red result caused entirely by copies. It is green
# in CI (no worktrees there), which is why it goes unnoticed for a long time.
