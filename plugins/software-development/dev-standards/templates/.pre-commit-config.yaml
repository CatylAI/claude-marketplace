# ─────────────────────────────────────────────────────────────────────────────
# [SHELL] Enable when shell scripts are present
# ─────────────────────────────────────────────────────────────────────────────
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: "v0.11.0.1"
  hooks:
    - id: shellcheck
      args: ['-x', '-e', 'SC1091']
      # Agent hook directories often carry zsh shebangs, which shellcheck aborts on
      # with SC1071.
      exclude: '^\.claude/hooks/'

# ─────────────────────────────────────────────────────────────────────────────
# [SECURITY] Always enabled
# ─────────────────────────────────────────────────────────────────────────────
# Two secret scanners, deliberately. Their rulesets disagree at the edges — one vendor's
# allowlist has been observed suppressing a live cloud key the other caught. Do not
# consolidate this down to one.
- repo: https://github.com/gitleaks/gitleaks
  rev: "v8.30.1"
  hooks:
    - id: gitleaks

- repo: local
  hooks:
    - id: trivy-secret
      name: Trivy secret scan
      # An explicit if/else, NOT `command -v trivy && trivy … || echo "not installed"`.
      # That form is `(A && B) || C`: when trivy IS present and FINDS a secret, B exits 1,
      # so C runs, the hook exits 0, and it prints "trivy not installed" — a found secret
      # reported as a missing tool, and the commit proceeds. If you edit this entry, keep
      # the tool-absent case in its own branch.
      entry: >
        sh -c 'if command -v trivy >/dev/null 2>&1; then
        trivy fs --scanners secret --severity HIGH,CRITICAL --exit-code 1
        --skip-dirs .worktrees --skip-dirs node_modules --skip-dirs .venv .;
        else echo "trivy not installed — secret scan SKIPPED (gitleaks still ran)"; fi'
      language: system
      pass_filenames: false
      stages: [pre-commit]

# IaC policy scan — enable when .tf, Dockerfile, or CloudFormation files exist.
# Pin language_version: checkov has segfaulted under newer Python runtimes.
