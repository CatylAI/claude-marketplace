# Pre-commit configuration — baseline template
#
# Copy into a repo root as `.pre-commit-config.yaml`, enable the sections whose file types
# the repo actually has, and leave the rest commented out with a one-line reason.
# See the `precommit-standards` skill for the review procedure and the drift categories.
#
# SECTION GUIDE
# ─────────────
# [CORE]      Always enabled — universal hygiene and conventional commits
# [PYTHON]    Enable for repos with Python source (ruff, mypy, pyupgrade)
# [TERRAFORM] Enable for repos with .tf files
# [SHELL]     Enable when shell scripts are present
# [SECURITY]  Always enabled — secret scanning, IaC policy
# [NODEJS]    Enable for repos with package.json
#
# GENERATED ARTIFACTS: machine-emitted files (rendered diagrams, generated SVGs and PNGs)
# do not obey the whitespace and EOF rules a source file does — a diagram renderer writes
# SVGs with no trailing newline, so end-of-file-fixer "fixes" them on every `--all-files`
# run, producing spurious diffs outside the change under review. The top-level `exclude:`
# below covers that tree and the rest of the canonical noise set. Keep it one alternation.

# ─────────────────────────────────────────────────────────────────────────────
# INSTALLED HOOK TYPES — load-bearing, do not drop
# ─────────────────────────────────────────────────────────────────────────────
# Without this, `pre-commit install` writes ONLY the pre-commit shim. Every
# `stages: [pre-push]` and `stages: [commit-msg]` hook below is then declared and never
# executed — a hook that never runs is indistinguishable from a hook that passes.
#
# Changing this list does NOT retro-install anything. Existing clones need one command:
#   pre-commit install --install-hooks
default_install_hook_types: [pre-commit, commit-msg, pre-push]

# ─────────────────────────────────────────────────────────────────────────────
# CANONICAL EXCLUSIONS
# ─────────────────────────────────────────────────────────────────────────────
# Dependency trees, caches, build output, lockfiles, minified assets and agent scratch
# directories. NOTE this reaches pre-commit ONLY — hooks that run with
# `pass_filenames: false` (whole-tree scanners) each need their own ignore config.
#
# Two entries are deliberately absent: any first-party source directory, and
# `.terraform.lock.hcl` (it is the providers-lock hook's own trigger — excluding it
# disables the hook).
exclude: |
  (?x)^(
      (?:[^/]+/)*(?:node_modules|\.venv|venv|__pycache__|\.ruff_cache|\.mypy_cache
        |\.pytest_cache|\.tox|\.terraform|\.terragrunt-cache|\.next|\.swc|\.nuxt
        |htmlcov|coverage|dist|build|out|target)/
    |\.(?:worktrees|orchestration|code-review|doc-review|cleanup|review
        |planning|ci-analysis|codebase-intel|build|task)/
    |vendor/
    |(?:[^/]+/)*(?:package-lock\.json|yarn\.lock|pnpm-lock\.yaml|poetry\.lock|uv\.lock
        |Cargo\.lock|Gemfile\.lock|composer\.lock)$
    |(?:[^/]+/)*[^/]*\.sum$
    |(?:[^/]+/)*[^/]*\.min\.(?:js|css)$
    |(?:[^/]+/)*[^/]*\.tsbuildinfo$
    |(?:[^/]+/)*\.DS_Store$
  )

# ─────────────────────────────────────────────────────────────────────────────
# [CORE] Universal hooks
# ─────────────────────────────────────────────────────────────────────────────
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: "v6.0.0"
  hooks:
  - id: check-added-large-files
    args: ['--maxkb=500']
  - id: check-case-conflict
  - id: check-json
  - id: check-merge-conflict
  - id: check-symlinks
  - id: check-toml
  - id: check-xml
  - id: check-yaml
    args: ['--unsafe']  # allow CI-specific YAML tags
  - id: detect-private-key
  - id: end-of-file-fixer
  - id: forbid-submodules   # remove in a repo that legitimately ships one (see note)
  - id: pretty-format-json
    args: ['--autofix']
  - id: trailing-whitespace
  - id: requirements-txt-fixer

# forbid-submodules NOTE: pre-commit tags a gitlink as `directory`, and its file list is
# `git ls-files`, so a repo that genuinely ships a submodule fails this hook under
# `--all-files`. Drop the hook in that repo rather than excluding the path.

# Conventional commit enforcement — required for semver and release-note automation.
# This only runs where the commit-msg shim is installed; see default_install_hook_types.
- repo: https://github.com/compilerla/conventional-pre-commit
  rev: "v4.4.0"
  hooks:
  - id: conventional-pre-commit
    stages: [commit-msg]
    args:
      - feat
      - fix
      - docs
      - style
      - refactor
      - perf
      - test
      - build
      - ci
      - chore
      - revert

