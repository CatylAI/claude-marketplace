#   hooks:
#     - id: ci-lint
#       name: eslint (pre-push)
#       entry: npx eslint --max-warnings=0
#       language: system
#       pass_filenames: false
#       stages: [pre-push]
#     - id: ci-typecheck
#       name: tsc --noEmit (pre-push)
#       entry: npx tsc --noEmit
#       language: system
#       pass_filenames: false
#       stages: [pre-push]
